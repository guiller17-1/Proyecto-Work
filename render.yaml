services:
  - type: web
    name: dashboard-truck-visits
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --timeout 120 --workers 1 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CACHE_SECONDS
        value: 600
      - key: CSV_URL
        sync: false
